<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>EasyCompta Scan</title>
  <meta name="theme-color" content="#0e6b57">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="EasyScan">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/icons/icon-192.png">
  <link rel="stylesheet" href="/styles.css">
  <style>
    body { padding-bottom: env(safe-area-inset-bottom); }
    .scan-wrap { max-width: 560px; margin: 0 auto; padding: 14px 16px 120px; }
    .scan-top { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; }
    .chips { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 4px; }
    .chips button { white-space: nowrap; border-radius: 999px; }
    .chips button.active { background: var(--primary); border-color: var(--primary); color: #fff; }
    .shoot {
      width: 100%; min-height: 150px; border-radius: 16px; border: 2px dashed var(--primary);
      background: var(--primary-soft); color: var(--primary); font-size: 1.15rem; font-weight: 700;
      flex-direction: column; justify-content: center; gap: 6px;
    }
    .shoot .big { font-size: 2.4rem; line-height: 1; }
    .pages { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 12px; }
    .page { position: relative; aspect-ratio: 3 / 4; border-radius: 8px; overflow: hidden; border: 1px solid var(--border); background: var(--surface-2); display: grid; place-items: center; }
    .page img { width: 100%; height: 100%; object-fit: cover; }
    .page .n { position: absolute; left: 6px; top: 6px; background: rgba(0,0,0,.6); color: #fff; font-size: .75rem; padding: 0 6px; border-radius: 6px; }
    .page button { position: absolute; right: 4px; top: 4px; min-height: 0; padding: 2px 8px; border-radius: 999px; background: rgba(0,0,0,.6); color: #fff; border: none; }
    .sendbar { position: fixed; left: 0; right: 0; bottom: 0; background: var(--surface); border-top: 1px solid var(--border); padding: 12px 16px calc(12px + env(safe-area-inset-bottom)); }
    .sendbar .inner { max-width: 560px; margin: 0 auto; display: flex; gap: 8px; }
    .sendbar button { flex: 1; justify-content: center; min-height: 48px; }
    .progress { height: 4px; background: var(--border); border-radius: 4px; overflow: hidden; margin-top: 8px; }
    .progress div { height: 100%; width: 0; background: var(--primary); transition: width .2s; }
    .recent li { display: flex; gap: 10px; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--border); }
    .toast { bottom: calc(110px + env(safe-area-inset-bottom)); }
    .recent ul { list-style: none; margin: 0; padding: 0; }
    .recent .t { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  </style>
</head>
<body>
  <div id="root" class="scan-wrap"></div>
  <script type="module" src="/scan.js"></script>
</body>
</html>
