<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>EasyCompta Scan</title>
  <meta name="theme-color" content="#063643">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="EasyScan">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/brand/favicon.png" type="image/png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap">
  <link rel="apple-touch-icon" href="/icons/icon-192.png">
  <link rel="stylesheet" href="/styles.css">
  <style>
    body { padding-bottom: env(safe-area-inset-bottom); }
    .scan-wrap { max-width: 560px; margin: 0 auto; padding: 0 16px 130px; }
    .scan-top { display: flex; align-items: center; gap: 12px; margin: 0 -16px 16px; padding: 14px 16px; background: var(--navy); background-image: radial-gradient(120% 120% at 100% 0%, rgba(2,160,145,.35), transparent 60%); border-radius: 0 0 22px 22px; box-shadow: var(--shadow-lg); animation: fadeIn .5s ease both; }
    .scan-top .brand-logo { height: 30px; }
    .scan-top select { background: rgba(255,255,255,.08); border-color: rgba(255,255,255,.18); color: #fff; }
    .scan-top select option { color: #0c2a33; }
    .chips { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; flex-wrap: nowrap; }
    .chips button { white-space: nowrap; }
    .chips button.active { background: var(--brand-gradient); border-color: transparent; color: #fff; }
    .shoot {
      position: relative; width: 100%; min-height: 170px; border-radius: 24px; border: none;
      background: var(--brand-gradient); background-size: 200% 200%; animation: gradientMove 10s ease infinite, fadeUp .6s var(--ease) both;
      color: #fff; font-size: 1.2rem; font-weight: 800; flex-direction: column; justify-content: center; gap: 6px; box-shadow: var(--shadow-lg); cursor: pointer;
    }
    .shoot:active { transform: scale(.98); }
    .shoot .big { width: 70px; height: 70px; border-radius: 50%; background: rgba(255,255,255,.16); display: grid; place-items: center; font-size: 2rem; animation: ring 2s ease-out infinite; }
    .gallery-btn { margin: 0; font-size: .92rem; }
    .pages { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 14px; }
    .page { position: relative; aspect-ratio: 3 / 4; border-radius: 12px; overflow: hidden; border: 1px solid var(--border); background: var(--surface-2); display: grid; place-items: center; animation: pop .4s var(--ease) both; box-shadow: var(--shadow); }
    .page img { width: 100%; height: 100%; object-fit: cover; }
    .page .n { position: absolute; left: 6px; top: 6px; background: var(--navy); color: #fff; font-size: .75rem; font-weight: 700; padding: 0 7px; border-radius: 6px; }
    .page button { position: absolute; right: 5px; top: 5px; min-height: 0; width: 26px; height: 26px; padding: 0; border-radius: 50%; background: rgba(6,54,67,.75); color: #fff; border: none; }
    .sendbar { position: fixed; left: 0; right: 0; bottom: 0; background: var(--surface); border-top: 1px solid var(--border); padding: 12px 16px calc(12px + env(safe-area-inset-bottom)); box-shadow: 0 -8px 24px rgba(6,54,67,.08); animation: slideUp .4s var(--ease) both; }
    @keyframes slideUp { from { transform: translateY(100%); } to { transform: none; } }
    .sendbar .inner { max-width: 560px; margin: 0 auto; display: flex; gap: 8px; }
    .sendbar button { flex: 1; min-height: 50px; }
    .progress { height: 5px; background: var(--border); border-radius: 5px; overflow: hidden; margin-top: 10px; }
    .progress div { height: 100%; width: 0; background: var(--brand-gradient); transition: width .2s; }
    .recent ul { list-style: none; margin: 0; padding: 0; }
    .recent li { display: flex; gap: 10px; align-items: center; padding: 11px 0; border-bottom: 1px solid var(--border); animation: fadeUp .4s var(--ease) both; }
    .recent li:last-child { border-bottom: none; }
    .recent .t { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .toast { bottom: calc(110px + env(safe-area-inset-bottom)); }
    .success { position: fixed; inset: 0; z-index: 250; display: grid; place-items: center; background: rgba(6,54,67,.55); backdrop-filter: blur(4px); animation: fadeIn .25s ease both; }
    .success .box { background: var(--surface); border-radius: 24px; padding: 28px 30px; text-align: center; box-shadow: var(--shadow-lg); animation: pop .45s var(--ease) both; }
    .success svg circle { stroke-dasharray: 190; stroke-dashoffset: 190; animation: draw .6s var(--ease) forwards; }
    .success svg path { stroke-dasharray: 60; stroke-dashoffset: 60; animation: draw .4s .5s var(--ease) forwards; }
    .login-card { margin-top: 8px; }
  </style>
</head>
<body>
  <div id="root" class="scan-wrap"></div>
  <script type="module" src="/scan.js"></script>
</body>
</html>
